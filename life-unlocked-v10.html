<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E6">
<title>Life, Unlocked • v0.10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E6;--card:#FFFFFF;--card2:#FFFDF8;--ink:#1F4744;--ink2:#3D5552;--muted:#5B6B68;--line:#E4DCCB;
  --teal:#2F6F68;--teal-soft:#DCEBE3;--mint:#E3EDE8;--sand:#ECE5D6;--sand2:#DDD4C2;
  --gold:#E9A23B;--gold-soft:#FBE7C2;--gold-ink:#7A4B07;--coral:#E07A5F;--coral-ink:#8C3A22;--good:#3E9A7E;
  --display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;--body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h1{font:600 24px/1.15 var(--display)}
h2{font:600 17px/1.2 var(--display)}
h3{font:600 15px/1.2 var(--display)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}
svg{display:block}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;background:var(--mint);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.coral{background:#FBE1D8;color:var(--coral-ink)}
.chip.small{font-size:11px;padding:3px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;font-weight:800;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#3D2604;border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--teal);padding:0 6px}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn:not(:disabled):active{transform:translateY(1px)}
.link{color:var(--teal);font-weight:800;font-size:13px;min-height:44px;padding:0 4px}
.card{background:var(--card);border-radius:18px;padding:12px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 0 8px}
.list{display:grid;gap:8px}

/* ---------- app shell ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1600px;margin:0 auto}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.ring{position:relative;width:48px;height:48px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 17px var(--display)}
.ring.pop{animation:pop .6s}
@keyframes pop{30%{transform:scale(1.25)}}
.who{flex:1;min-width:0}
.who .name{font:600 17px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .chips{display:flex;gap:6px}
.brand{display:none}
.main{flex:1;min-height:0;display:flex}
.screen{display:none;flex-direction:column;flex:1;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px 16px}
.main[data-screen=battle] #scr-battle,.main[data-screen=grid] #scr-grid,.main[data-screen=careers] #scr-careers,.main[data-screen=life] #scr-life,.main[data-screen=journal] #scr-journal{display:flex}
nav.tabs{flex:none;order:3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;font-size:11px;font-weight:800;color:var(--muted)}
.tab .pill{display:flex;padding:4px 16px;border-radius:999px}
.tab.on{color:var(--ink)}
.tab.on .pill{background:var(--teal-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--gold);color:#3D2604;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.badge[hidden]{display:none}

/* ---------- battle ---------- */
.stagehead{display:flex;align-items:center;justify-content:space-between}
.stages{display:flex;align-items:center;margin:2px 0 10px}
.stages .seg{flex:1;height:4px;background:var(--sand2)}
.stages .seg.on{background:var(--teal)}
.sdot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sand2);display:flex;align-items:center;justify-content:center;position:relative}
.sdot::after{content:'';position:absolute;inset:-10px}
.sdot.done{background:var(--teal)}
.sdot.cur{width:30px;height:30px;background:var(--bg);border:4px solid var(--coral)}
.sdot.boss{border-radius:9px;width:30px;height:30px}
.sdot.boss.done{background:var(--gold)}
.sdot.locked{cursor:default}
.scene{position:relative;flex:1 0 auto;min-height:236px;max-height:330px;height:44vh;border-radius:24px;background:#DCEBE3;overflow:hidden}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:#C9DCCF}
.scene .win{position:absolute;left:22px;top:104px;width:64px;height:48px;border-radius:10px;background:#EEF5EF;border:3px solid #B9D0C2}
.scene[data-region='1'] {background:#E4E3F1}.scene[data-region='1'] .floor{background:#D3D1E6}
.scene[data-region='2'] {background:#F3E6D3}.scene[data-region='2'] .floor{background:#E7D3B7}
.scene[data-region='3'] {background:#E1E9F2}.scene[data-region='3'] .floor{background:#CBD7E6}
.bars{position:absolute;left:14px;right:14px;top:12px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.barlab{display:flex;justify-content:space-between;font-size:12px;font-weight:800;gap:4px}
.bar{height:10px;border-radius:6px;background:#fff;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--good);transition:width .25s}
.bar.foe i{background:var(--coral)}
.scene .tools{position:absolute;right:10px;top:52px;display:flex;gap:6px}
.mini{min-width:44px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:12px;font-weight:800}
.mini[aria-pressed=true]{background:var(--ink);color:#fff}
.mech{position:absolute;left:12px;top:52px;display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:var(--coral-ink);max-width:55%}
.fighter{position:absolute;bottom:26px}
.fighter.hero{left:8%}
.fighter.foe{right:7%}
.fighter svg{width:min(28vw,118px);height:auto}
.enemyname{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:600 16px var(--display);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{position:absolute;inset:0;pointer-events:none}
.fxn{position:absolute;font:700 22px var(--display);color:var(--coral-ink);transform:translate(-50%,0);animation:fxup .9s ease-out forwards;white-space:nowrap}
.fxn.small{font-size:15px;color:var(--ink2);opacity:.85}
.fxn.heal{color:var(--good)}
.fxn.hurt{color:#B4442A;font-size:16px}
.fxn.label{font:600 14px var(--display);color:var(--teal);background:#fff;border-radius:999px;padding:2px 10px}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-48px)}}
.hit{animation:hit .28s}
@keyframes hit{30%{transform:translateX(9px) rotate(3deg)}70%{transform:translateX(-4px)}}
.ko{animation:ko .5s}
@keyframes ko{50%{transform:scale(.85);opacity:.3}}
.ticker{font-size:13px;font-weight:700;color:var(--ink2);min-height:20px;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abilities{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px}
.abil .ic b{font:700 15px var(--display)}
.abil{background:#fff;border-radius:18px;padding:10px 3px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:92px;font-size:11.5px;overflow-wrap:break-word;hyphens:auto;font-weight:800;text-align:center;line-height:1.15}
.abil .ringwrap{position:relative;width:44px;height:44px}
.abil .ringwrap>svg{position:absolute;inset:0}
.abil .ringwrap .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.abil.cool{color:var(--muted)}
.abil.empty{background:transparent;border:2px dashed #CFC5B2;color:var(--muted);justify-content:center}
.nudge{margin-top:12px;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--gold-soft)}
.nudge.teal{background:var(--teal-soft)}
.nudge .txt{flex:1;min-width:0}
.nudge b{display:block;font-size:14px;color:#5A3705}
.nudge.teal b{color:var(--ink)}
.nudge small{display:block;font-size:12px;font-weight:700;color:var(--gold-ink)}
.nudge.teal small{color:var(--ink2)}
.battlestats{font-size:12px;font-weight:700;margin-top:10px}

/* ---------- grid ---------- */
#scr-grid{overflow:hidden;padding-bottom:0}
.gridhead{display:flex;align-items:center;gap:8px;padding:2px 0 8px}
.gridhead h1{flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.search{display:flex;gap:6px;margin-bottom:8px}
.search[hidden]{display:none}
.search input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
.regions{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;flex:none}
.regions::-webkit-scrollbar{display:none}
.region{flex:none;border-radius:999px;padding:0 14px;min-height:40px;background:#fff;font-weight:800;font-size:13px;white-space:nowrap}
.region.on{background:var(--ink);color:#fff}
.goal{flex:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:10px}
.goal .gi{width:36px;height:36px;border-radius:11px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex:none}
.goal b{display:block;font-size:14px}
.goal small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.mapwrap{position:relative;flex:1 1 0;min-height:200px;border-radius:24px;background:#EAF1EC;overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.maptools{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.maptools button{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #1F474420}
.minimap{position:absolute;right:10px;bottom:10px;width:60px;height:60px;border-radius:12px;background:#ffffffd9;border:1px solid #D7E2DA;pointer-events:none}
#map .edge{stroke:#C9D6CE;stroke-width:3;fill:none}
#map .edge.on{stroke:var(--teal);stroke-width:4}
#map .edge.path{stroke:var(--gold);stroke-width:6;stroke-dasharray:2 9;stroke-linecap:round}
#map .edge.long{stroke-dasharray:8 8}
#map .edge.hide{display:none}
#map .nd{cursor:pointer}
#map .nd .hitc{fill:transparent}
#map .nd .b{fill:#FFFDF8;stroke:#CFC6B4;stroke-width:2.5}
#map .nd.avail .b{stroke:var(--c);stroke-width:4.5}
#map .nd.own .b{fill:var(--c);stroke:var(--c)}
#map .nd.path .b{stroke:var(--gold);stroke-width:5}
#map .nd.sel .b{stroke:var(--ink);stroke-width:5}
#map .nd.sel .halo{fill:var(--gold-soft)}
#map .nd .halo{fill:transparent}
#map .nd .mk{font:700 15px var(--body);fill:#B3AA98;text-anchor:middle;pointer-events:none}
#map .nd.avail .mk{fill:var(--c)}
#map .nd.own .mk{fill:#fff}
#map .lab{font:800 13px var(--body);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:#EAF1EC;stroke-width:4px;stroke-linejoin:round}
#map .nd.lock .lab{fill:#7B8784}
#map .rtitle{font:700 64px var(--display);text-anchor:middle;opacity:.9;pointer-events:none}
#map.zfar .lab{display:none}
#map.zfar .nd.sel .lab,#map.zfar .nd.major .lab{display:block}
#map.zmid .nd.lock:not(.path):not(.major) .lab{display:none}
#map:not(.zfar) .rtitle{display:none}
.nodesheet{flex:none;margin:10px -16px 0;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px 14px;box-shadow:0 -4px 16px #1F474414;display:flex;flex-direction:column;gap:8px}
.nodesheet .handle{width:40px;height:5px;border-radius:3px;background:var(--sand2);align-self:center}
.nodesheet p{font-size:13px;line-height:1.4;color:var(--ink2)}
.nodesheet .req{font-size:12px;font-weight:700;color:var(--muted)}

/* ---------- careers ---------- */
.seg3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sand);border-radius:14px;padding:4px;margin:10px 0 12px}
.seg3 button{border-radius:10px;min-height:40px;font-weight:800;font-size:13px;color:var(--muted)}
.seg3 button.on{background:#fff;color:var(--ink)}
.hero-card{background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.hero-card .eyebrow{color:#BFD8CF}
.hero-card h2{font-size:18px}
.hero-card p{font-size:13px;color:#DCEBE3}
.hero-card .btn{align-self:flex-start;margin-top:4px}
.ccard{background:#fff;border-radius:18px;padding:12px;display:flex;gap:12px;border:2px solid transparent}
.ccard.active{border-color:var(--teal)}
.ccard.locked{background:#FBF8F1;border:2px dashed var(--sand2)}
.tile{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.ccard .body{flex:1;min-width:0}
.ccard .t{display:flex;align-items:center;gap:6px}
.ccard .t b{font-size:15px;flex:1;min-width:0}
.ccard .meta{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.prog{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.prog i{height:6px;border-radius:3px;background:var(--sand2)}
.prog i.on{background:var(--teal)}
.prog i.boss{background:var(--gold)}
.ccard .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* ---------- life ---------- */
.house{background:var(--teal-soft);border-radius:24px;padding:16px 14px 14px;margin-top:10px}
.house .roof{display:block;margin:0 auto;width:100%;max-width:330px;height:auto}
.rooms{max-width:330px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;background:var(--ink);border:3px solid var(--ink);border-top:0}
.room{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800;padding:6px 4px;text-align:center;line-height:1.15}
.room .ra{width:64px;height:auto}
.room:disabled{opacity:1;color:#7B8784}
.room small{font-size:11px;font-weight:700}
.room.empty{background:var(--bg)!important;color:var(--teal)}
.room.locked{background:#EFEAE0!important;color:#7B8784}
.bonuses{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.bonuses .chip{background:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.ltile{background:#fff;border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px}
.ltile h2{display:flex;align-items:center;justify-content:space-between;width:100%}
.ltile small{font-size:12px;font-weight:700;color:var(--muted)}
.ltile .big{font:600 22px var(--display);color:var(--teal)}
.subhead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.subhead h1{flex:1}
.item{background:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.item .body{flex:1;min-width:0}
.item b{display:block;font-size:14px}
.item small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item .art{width:42px;height:42px;flex:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.slot b,.slot small{display:block}
.slot .row{flex-wrap:wrap}
.slot{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.slot.emptyslot{border:2px dashed #CFC5B2;background:transparent}
.slot .art{width:42px;height:42px}
.slot small{font-size:12px;font-weight:700;color:var(--muted)}
.rarity{font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--sand)}
.rarity.Uncommon{background:#DCEBE3}.rarity.Rare{background:#DDE3F5}.rarity.Legendary{background:var(--gold-soft);color:var(--gold-ink)}

/* ---------- journal ---------- */
.stat{display:grid;gap:4px;padding:6px 0}
.stat .spread{font-size:13px;font-weight:700}
.meter{height:6px;border-radius:4px;background:var(--sand2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
details.card summary{cursor:pointer;font:600 15px var(--display);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
.ach{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-weight:700}
.ach:first-child{border-top:0}
.ach .tile{width:36px;height:36px;border-radius:11px}
.help li{margin:4px 0;font-size:14px}

/* ---------- toast + dialogs ---------- */
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:20;max-width:min(420px,92vw);background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 6px 20px #1F474440;pointer-events:none;animation:toast .25s ease-out}
.toast[hidden]{display:none}
@keyframes toast{from{opacity:0;transform:translate(-50%,-8px)}}
dialog{border:0;padding:0;color:var(--ink);background:transparent;max-width:100vw;max-height:100dvh}
dialog::backdrop{background:#1F474466}
.sheet{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-height:86dvh}
.sheet .inner{background:var(--card2);border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:86dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet[open] .inner{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--sand2);align-self:center;flex:none}
.discovery .inner{background:var(--card2);border-radius:24px;padding:24px;width:min(420px,92vw);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.discovery[open] .inner{animation:pop2 .3s ease-out}
@keyframes pop2{from{transform:scale(.9);opacity:0}}
.discovery h2{font-size:26px}
.discovery p{line-height:1.45}
.discovery .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ---------- desktop ---------- */
@media (min-width:980px){
  .top{padding:14px 20px 10px}
  .brand{display:block;font:700 22px var(--display);color:var(--ink);margin-right:8px}
  nav.tabs{order:0;display:flex;gap:6px;background:transparent;border:0;padding:0 20px 10px}
  .tab{flex-direction:row;min-height:44px;font-size:14px;padding:0 18px 0 12px;gap:6px;background:#fff;border-radius:999px}
  .tab .pill{padding:0;background:none!important}
  .tab.on{background:var(--ink);color:#fff}
  .tab[data-screen=battle]{display:none}

// ---------------- discovery ----------------
function showDiscovery() {
  if (currentDiscovery !== null || !discoveryQueue.length) return;
  // only show the newest when several arrive at once
  if (discoveryQueue.length > 1) { const extra = discoveryQueue.length - 1; discoveryQueue = discoveryQueue.slice(-1); notice(extra + ' more career' + (extra > 1 ? 's' : '') + ' discovered · see Careers'); }
  currentDiscovery = discoveryQueue.shift(); const i = currentDiscovery, c = careers[i];
  $('discoveryArt').innerHTML = `<div class="row" style="justify-content:center;gap:12px">${careerTile(i, 64)}${heroSVG(i, 80)}</div>`;
  $('discoveryTitle').textContent = c[0];
  $('discoveryFact').textContent = jokes[i] || 'Another perfectly reasonable life choice.';
  $('discoveryReward').textContent = `$${c[2]}/min · +${c[4]} impact · ${tierNames[careerTier(i)]} track · mastery perk ${careerPerk(i)[2]}`;
  if (!$('discovery').open) $('discovery').showModal();
}
function closeDiscovery(change) {
  const i = currentDiscovery;
  if (change && i !== null) { s.career = i; switchTrack(i); }
  currentDiscovery = null; $('discovery').close(); renderAll(); save(); showDiscovery();
}
$('discovery').addEventListener('cancel', e => { e.preventDefault(); closeDiscovery(false); });

// ---------------- screens ----------------
function setScreen(name) {
  screen = name; $('main').dataset.screen = name;
  const shown = desktopMQ.matches && name === 'battle' ? 'grid' : name;
  document.querySelectorAll('#nav .tab').forEach(b => { const on = b.dataset.screen === shown; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (name === 'careers') s.seenDisc = s.discovered.filter(i => i > 0).length;
  if (name === 'life') lifeView = 'home';
  renderScreens(true);
  if (isVisible('grid')) requestAnimationFrame(applyView);
  const scr = $('scr-' + name); if (scr && name !== 'grid' && name !== 'battle') scr.scrollTop = 0;
  renderHUD();
}
function renderScreens(force) {
  if (force) { delete sig.careers; delete sig.life; delete sig.journal; }
  const vis = visibleScreens();
  if (vis.includes('grid')) { if (!MAP.built) buildMap(); updateMap(); renderRegions(); renderGoal(); renderNodeSheet(); }
  if (vis.includes('careers')) renderCareers();
  if (vis.includes('life')) renderLife();
  if (vis.includes('journal')) renderJournal();
}
function renderAll() {
  checkDiscoveries(); recordJournal();
  renderHUD(); renderBattle(); hudTick(); renderScreens(); renderSheet();
  dirty = false;
}

// ---------------- actions ----------------
const ACT = {
  nav: a => setScreen(a),
  stage: a => { const j = +a; if (j <= s.unlocked && !isGated(s.track, j)) { s.stage = j; s.retry = 0; resetBattle(); } },
  trackSheet: () => openSheet('track'),
  setTrack: a => { switchTrack(+a); if (sheetKind === 'track') closeSheet(); notice('Now battling: ' + (+a ? careers[+a][0] : 'Everyday Life')); if (!desktopMQ.matches && screen !== 'battle') setScreen('battle'); },
  work: a => { const i = +a; if (i === 0 || qualifies(careers[i])) { s.career = i; switchTrack(i); notice('Now working as ' + careers[i][0] + '. Skills and loadout kept.'); } },
  auto: () => { s.auto = !s.auto; notice('Auto advance ' + (s.auto ? 'on' : 'off')); },
  pause: () => { s.paused = !s.paused; },
  loadout: () => openSheet('loadout'),
  equipAb: a => { if (s.equipped.includes(a)) s.equipped = s.equipped.filter(x => x !== a); else if (s.equipped.length < slots() && owned(byName[a])) s.equipped.push(a); },
  presetSave: a => { s.presets[+a] = [...s.equipped]; notice('Build ' + (+a + 1) + ' saved.'); },
  presetLoad: a => { const p = s.presets[+a]; if (Array.isArray(p)) { s.equipped = p.filter(n => abilities[n] && owned(byName[n])).slice(0, slots()); notice('Build ' + (+a + 1) + ' loaded.'); } },
  closeSheet: () => closeSheet(),
  search: () => { const f = $('searchRow'); f.hidden = !f.hidden; if (!f.hidden) $('skillSearch').focus(); },
  region: a => { const R = REGIONS[+a]; MAP.region = +a; Object.assign(MAP.view, { cx: R.cx, cy: R.cy, w: Math.max(R.w, $('mapwrap').getBoundingClientRect().width / 1.05) }); applyView(); },
  zoomIn: () => zoom(.75), zoomOut: () => zoom(1.33), zoomAll: () => { MAP.region = -1; Object.assign(MAP.view, { cx: 0, cy: 0, w: 6200 }); applyView(); },
  goal: () => { const g = nextGoal(); if (g && g.first) selectNode(g.first, true); },
  learn: () => learnSelected(),
  showPath: a => { s.goalCareer = +a; goalCache.key = ''; setScreen('grid'); const g = nextGoal(); if (g && g.first) selectNode(g.first, true); },
  careerFilter: a => { careerFilter = a; },
  life: a => { lifeView = a; $('scr-life').scrollTop = 0; delete sig.life; },
  homeUp: () => { const i = s.home; if (i < 3 && s.money >= homePrices[i]) { s.money -= homePrices[i]; s.home++; notice('Moved to ' + homeNames[s.home] + '!'); } },
  buildRoom: a => { const j = +a, r = rooms[j]; if (!s.rooms.includes(j) && s.home >= r[1] && owned(r[3]) && s.money >= r[2]) { s.money -= r[2]; s.rooms.push(j); openSheet('room', j); } },
  roomSheet: a => openSheet('room', +a),
  decor: a => { const k = +a, r = sheetArg; if (s.rooms.includes(r) && s.furniture[k] && furniture[k][1] === r) s.decor[r] = k; },
  fbuy: a => { const k = +a, f = furniture[k]; if (s.money >= f[2]) { s.money -= f[2]; s.furniture[k] = (s.furniture[k] || 0) + 1; if (s.decor[f[1]] === undefined && s.rooms.includes(f[1])) s.decor[f[1]] = k; } },
  fcraft: a => { const k = +a, f = furniture[k]; if (owned('home-skill-0') && s.parts >= f[3]) { s.parts -= f[3]; s.furniture[k] = (s.furniture[k] || 0) + 1; } },
  equip: a => { const i = +a; if (!s.inventory[i]) return; s.gear = s.gear.filter(j => items[j][5] !== items[i][5]); s.gear.push(i); },
  unequip: a => { s.gear = s.gear.filter(j => j !== +a); },
  salvage: a => { const i = +a; if (s.inventory[i] > (s.gear.includes(i) ? 1 : 0)) { s.inventory[i]--; s.parts += i >= 16 ? 5 : i >= 9 ? 3 : 1; } },
  upgrade: a => { const i = +a, c = gearUpgradeCost(i); if ((s.gearLv[i] || 0) < 10 && s.money >= c) { s.money -= c; s.gearLv[i] = (s.gearLv[i] || 0) + 1; notice(items[i][0] + ' upgraded to level ' + s.gearLv[i] + '.'); } },
  buy: a => { const i = +a; if (s.money >= items[i][1]) { s.money -= items[i][1]; s.inventory[i] = (s.inventory[i] || 0) + 1; notice('Bought ' + items[i][0] + '. Equip it in Gear.'); } },
  craft: a => { const i = +a, c = Math.ceil(items[i][1] / 25); if (s.parts >= c) { s.parts -= c; s.inventory[i] = (s.inventory[i] || 0) + 1; notice('Crafted ' + items[i][0] + '.'); } },
  petbuy: a => { const i = +a, l = s.pets[i] || 0, c = pets[i][1] * (l + 1); if (l < 5 && owned(pets[i][2]) && s.money >= c) { s.money -= c; s.pets[i] = l + 1; if (s.activePet === null) s.activePet = i; } },
  petsel: a => { const i = +a; if (s.pets[i]) s.activePet = s.activePet === i ? null : i; },
  business: a => { const i = +a, l = s.businesses[i] || 0, c = businessCost(i); if (s.progress[i]?.mastered && l < 5 && s.money >= c) { s.money -= c; s.businesses[i] = l + 1; } },
  train: a => { const c = trainingCost(a); if (s.money >= c) { s.money -= c; s.training[a] = (s.training[a] || 0) + 1; } },
  autoNext: (a, el) => { s.autoNext = el.checked; },
  save: () => { save(); notice('Saved.'); },
  export: () => { save(); const u = URL.createObjectURL(new Blob([JSON.stringify(s, null, 2)], { type: 'application/json' })), l = document.createElement('a'); l.href = u; l.download = 'life-unlocked-save.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); },
  import: () => $('importFile').click(),
  importConfirm: () => applyImport(),
  copySave: () => { save(); navigator.clipboard?.writeText(JSON.stringify(s)).then(() => notice('Save copied. Paste it into a .json file to keep it.'), () => notice('Copy was blocked by the browser.')); },
  newgameSheet: () => openSheet('newgame'),
  newgame: () => { if (($('ngConfirm')?.value || '').trim().toUpperCase() !== 'NEW') { notice('Type NEW to confirm.'); return; } s = fresh(); discoveryQueue = []; currentDiscovery = null; setTrack(0); selected = 'origin'; resetBattle(); logs = []; closeSheet(); for (const k in sig) delete sig[k]; goalCache.key = ''; MAP.nodes && Object.values(MAP.nodes).forEach(r => r.cls = ''); MAP.edges.forEach(e => e.cls = ''); log('Congratulations, you exist.'); setScreen('battle'); },
  discoveryKeep: () => closeDiscovery(false), discoverySwitch: () => closeDiscovery(true),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'INPUT') return; // handled on change
  e.preventDefault();
  fn(el.dataset.arg, el);
  if (!['nav', 'zoomIn', 'zoomOut', 'zoomAll', 'region', 'search', 'goal', 'discoveryKeep', 'discoverySwitch', 'closeSheet'].includes(el.dataset.act)) { renderAll(); save(); }
  else if (el.dataset.act === 'region' || el.dataset.act === 'zoomAll') renderRegions();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset?.act === 'autoNext') { ACT.autoNext(null, el); renderAll(); save(); }
  if (el.id === 'importFile') importSave(el);
});
$('searchRow').addEventListener('submit', e => { e.preventDefault(); const q = $('skillSearch').value.trim().toLowerCase(); if (!q) return; const n = nodes.find(n => n.name.toLowerCase() === q) || nodes.find(n => n.name.toLowerCase().includes(q)); if (!n) { notice('No matching skill found.'); return; } selectNode(n.id, true); });
async function importSave(input) {
  const f = input.files[0]; if (!f) return;
  try {
    const r = JSON.parse(await f.text());
    if (!r || !Array.isArray(r.owned) || !r.owned.includes('origin') || !r.owned.every(id => nodeById[id]) || !Array.isArray(r.equipped) || !r.equipped.every(n => abilities[n]) || !Array.isArray(r.gear) || !r.gear.every(i => items[i]) || !Number.isInteger(r.level) || r.level < 1 || !Number.isFinite(r.money) || r.money < 0 || !Number.isFinite(r.lp) || r.lp < 0 || !careers[r.career] || !careers[r.track] || !r.progress || typeof r.progress !== 'object') throw Error('that file is not a Life, Unlocked save');
    pendingImport = r; openSheet('import');
  } catch (err) { notice('Could not import: ' + err.message); } finally { input.value = ''; }
}
let pendingImport = null;
function applyImport() {
  const r = pendingImport; if (!r) return; pendingImport = null;
  {
    s = { ...fresh(), ...r }; sanitize(); s.last = Date.now(); discoveryQueue = []; currentDiscovery = null; setTrack(s.track); selected = 'origin'; resetBattle(); for (const k in sig) delete sig[k]; goalCache.key = ''; closeSheet(); renderAll(); save(); notice('Character imported.');
  }
}

// ---------------- start ----------------
document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, 22)));
$('skillNames').innerHTML = [...new Set(nodes.map(n => n.name))].map(n => `<option value="${esc(n)}"></option>`).join('');
desktopMQ.addEventListener('change', () => setScreen(screen));
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAll(); });
setTrack(s.track);
(function offline() {
  const elapsed = Math.min(28800, Math.max(0, (Date.now() - s.last) / 1000));
  if (elapsed <= 60 || s.paused) return;
  let idx = s.stage; while (idx > 0 && !battleForecast(enemies[idx], idx).ok) idx--;
  const e = enemies[idx], f = battleForecast(e, idx), count = f.ok ? Math.floor(elapsed / Math.max(2, Math.ceil(f.ttk) + 1)) : 0;
  const before = s.money; gainXP(count * e[4]); s.money += count * e[5] + elapsed * income() / 60; s.wins += count; s.parts += Math.floor(count * .2);
  setTimeout(() => notice(`Welcome back! About ${fmt(count)} obstacles solved while you were away · +${fmt(count * e[4])} XP · +${money$(s.money - before)}. Stages only advance while you play.`), 400);
})();
resetBattle(); log('Life begins. Try your best!');
setScreen('battle'); renderAll(); save();
setInterval(tick, 1000);
setInterval(() => { save(); if (!document.hidden) renderScreens(); }, 5000);
window.addEventListener('pagehide', save);
</script>
</body>
</html>
